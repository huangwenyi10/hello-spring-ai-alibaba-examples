server:
  port: 19100

spring:
  application:
    name: mcp-streamable-webflux-client
  main:
    # 把 web-application-type 设置成 none，代表这是一个非 Web 控制台应用
    web-application-type: none
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}

    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        request-timeout: 600s
        type: ASYNC  # or ASYNC for reactive applications
        streamable-http:
          connections:
            server1:
              url: http://localhost:20000
              endpoint: /mcp
